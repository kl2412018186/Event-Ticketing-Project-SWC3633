<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventTicketing - Admin Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .navbar-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #ffffff;
            padding: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .table-custom {
            color: #ffffff;
            background: transparent;
        }
        .table-custom th, .table-custom td {
            background: transparent !important;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
            vertical-align: middle;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            color: white;
        }
        .btn-outline-custom {
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            background: transparent;
            border-radius: 8px;
        }
        .btn-outline-custom:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: #fff;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-control-custom {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            padding: 10px;
        }
        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-color: #ff416c;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass mb-4 py-3">
        <div class="container">
            <a class="navbar-brand logo-text" href="admin_dashboard.html">🛡️ Admin Portal</a>
            <div>
                <button class="btn btn-outline-custom btn-sm me-2" onclick="exportBookingsCSV()">📥 Export CSV</button>
                <button class="btn btn-outline-custom btn-sm me-2" data-bs-toggle="modal" data-bs-target="#addEventModal">+ Add New Event</button>
                <button class="btn btn-outline-custom btn-sm" onclick="localStorage.clear(); window.location.href='login.html';">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mb-5">
        <h2 class="mb-4 fw-bold">Admin Management Center</h2>

        <!-- Statistics Overview Cards -->
        <div class="row mb-5">
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <span class="text-white-50 small text-uppercase">Total Events</span>
                    <h2 id="statTotalEvents" class="fw-bold text-info mt-1 mb-0">0</h2>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <span class="text-white-50 small text-uppercase">Total Bookings</span>
                    <h2 id="statTotalBookings" class="fw-bold text-warning mt-1 mb-0">0</h2>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <span class="text-white-50 small text-uppercase">Total Revenue</span>
                    <h2 id="statTotalRevenue" class="fw-bold text-success mt-1 mb-0">RM 0.00</h2>
                </div>
            </div>
        </div>

        <!-- Section 1: Manage Events with Live Search -->
        <div class="card glass-card mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h4 class="text-info mb-0">Manage Events</h4>
                <div class="d-flex gap-2">
                    <input type="text" id="searchEventInput" class="form-control form-control-custom form-control-sm" placeholder="Search event..." onkeyup="filterEvents()">
                    <button class="btn btn-gradient btn-sm" data-bs-toggle="modal" data-bs-target="#addEventModal">+ Add Event</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-custom align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Event Name</th>
                            <th>Date</th>
                            <th>Price (RM)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminEventList">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-white-50">Loading events...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Section 2: All User Bookings -->
        <div class="card glass-card mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="text-info mb-0">All User Bookings</h4>
                <button class="btn btn-outline-custom btn-sm" onclick="exportBookingsCSV()">Export to CSV</button>
            </div>
            <div class="table-responsive">
                <table class="table table-custom align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>User</th>
                            <th>Event Name</th>
                            <th>Tickets</th>
                            <th>Total (RM)</th>
                        </tr>
                    </thead>
                    <tbody id="adminBookingList">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-white-50">Loading bookings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Add Event -->
    <div class="modal fade" id="addEventModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border border-secondary" style="background: #1a1635;">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title text-info fw-bold">➕ Create New Event</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addEventForm">
                    <div class="modal-body py-3">
                        <div class="mb-3">
                            <label class="form-label text-white-50">Event Name</label>
                            <input type="text" id="eventName" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Event Date & Time</label>
                            <input type="datetime-local" id="eventDate" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Venue ID</label>
                            <input type="number" id="venueId" class="form-control form-control-custom" placeholder="Example: 1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Available Tickets</label>
                            <input type="number" id="availableTickets" class="form-control form-control-custom" placeholder="Example: 100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Ticket Price (RM)</label>
                            <input type="number" step="0.01" id="eventPrice" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Description</label>
                            <textarea id="eventDescription" class="form-control form-control-custom" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-gradient">Save Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Edit Event -->
    <div class="modal fade" id="editEventModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border border-secondary" style="background: #1a1635;">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title text-info fw-bold">✏️ Edit Event</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editEventForm">
                    <input type="hidden" id="editEventId">
                    <div class="modal-body py-3">
                        <div class="mb-3">
                            <label class="form-label text-white-50">Event Name</label>
                            <input type="text" id="editEventName" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Event Date & Time</label>
                            <input type="datetime-local" id="editEventDate" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Venue ID</label>
                            <input type="number" id="editVenueId" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Available Tickets</label>
                            <input type="number" id="editAvailableTickets" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Ticket Price (RM)</label>
                            <input type="number" step="0.01" id="editEventPrice" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white-50">Description</label>
                            <textarea id="editEventDescription" class="form-control form-control-custom" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-gradient">Update Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript Integration -->
    <script>
        let token = '';
        try {
            token = localStorage.getItem('token') || '';
        } catch (e) {
            console.warn("Storage blocked");
        }

        let allEventsCache = [];
        let allBookingsCache = [];

        async function fetchAdminEvents() {
            const tableBody = document.getElementById('adminEventList');
            try {
                const response = await fetch('http://localhost/EventTicketing/api/index.php/events', {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error("HTTP error");
                const data = await response.json();
                let events = [];
                if (Array.isArray(data)) events = data;
                else if (data.events && Array.isArray(data.events)) events = data.events;
                else if (data.data && Array.isArray(data.data)) events = data.data;

                allEventsCache = events;
                document.getElementById('statTotalEvents').textContent = events.length;
                renderEvents(events);
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">Failed to load events.</td></tr>`;
            }
        }

        function renderEvents(events) {
            const tableBody = document.getElementById('adminEventList');
            tableBody.innerHTML = '';
            if (events.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-white-50">No events found.</td></tr>`;
                return;
            }
            events.forEach(event => {
                const eventId = event.event_id || event.id;
                tableBody.innerHTML += `
                    <tr>
                        <td class="fw-bold">#${eventId || 'N/A'}</td>
                        <td>${event.event_name || event.title || 'Untitled'}</td>
                        <td>${event.event_date || event.date || 'TBA'}</td>
                        <td class="text-success fw-bold">RM ${parseFloat(event.ticket_price || event.price || 0).toFixed(2)}</td>
                        <td>
                            <button class="btn btn-outline-custom btn-sm me-1" onclick="openEditModal(${eventId})">Edit</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteEvent(${eventId})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function filterEvents() {
            const query = document.getElementById('searchEventInput').value.toLowerCase();
            const filtered = allEventsCache.filter(e => 
                (e.event_name || e.title || '').toLowerCase().includes(query)
            );
            renderEvents(filtered);
        }

        async function fetchAdminBookings() {
            const bookingTable = document.getElementById('adminBookingList');
            try {
                const response = await fetch('http://localhost/EventTicketing/api/index.php/bookings', {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                });
                if (!response.ok) {
                    bookingTable.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-white-50">No booking records found.</td></tr>`;
                    return;
                }
                const data = await response.json();
                let bookings = [];
                if (Array.isArray(data)) bookings = data;
                else if (data.bookings && Array.isArray(data.bookings)) bookings = data.bookings;
                else if (data.data && Array.isArray(data.data)) bookings = data.data;

                allBookingsCache = bookings;
                document.getElementById('statTotalBookings').textContent = bookings.length;

                let totalRevenue = 0;
                bookings.forEach(b => {
                    totalRevenue += parseFloat(b.total_price || b.price || 0);
                });
                document.getElementById('statTotalRevenue').textContent = `RM ${totalRevenue.toFixed(2)}`;

                bookingTable.innerHTML = '';
                if (bookings.length === 0) {
                    bookingTable.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-white-50">No bookings recorded yet.</td></tr>`;
                    return;
                }
                bookings.forEach(b => {
                    bookingTable.innerHTML += `
                        <tr>
                            <td class="fw-bold">#${b.booking_id || b.id || 'N/A'}</td>
                            <td>${b.user_name || b.username || 'Customer'}</td>
                            <td>${b.event_name || b.title || 'Event'}</td>
                            <td>${b.quantity || b.tickets || 1}</td>
                            <td class="text-success fw-bold">RM ${parseFloat(b.total_price || b.price || 0).toFixed(2)}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                bookingTable.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-white-50">No active booking records.</td></tr>`;
            }
        }

        // Add New Event Form Submission
        document.getElementById('addEventForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const bodyData = {
                event_name: document.getElementById('eventName').value,
                event_date: document.getElementById('eventDate').value,
                venue_id: document.getElementById('venueId').value,
                available_tickets: document.getElementById('availableTickets').value,
                ticket_price: document.getElementById('eventPrice').value,
                description: document.getElementById('eventDescription').value
            };

            try {
                const response = await fetch('http://localhost/EventTicketing/api/index.php/events', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const result = await response.json();
                if (response.ok) {
                    alert("Event created successfully!");
                    location.reload();
                } else {
                    alert(result.message || "Failed to create event.");
                }
            } catch (error) {
                alert("Error connecting to server.");
            }
        });

        // Open Edit Modal & Populate Data
        function openEditModal(eventId) {
            const event = allEventsCache.find(e => (e.event_id || e.id) == eventId);
            if (!event) return;

            document.getElementById('editEventId').value = eventId;
            document.getElementById('editEventName').value = event.event_name || event.title || '';
            const rawDate = event.event_date || event.date || '';
            document.getElementById('editEventDate').value = rawDate.replace(' ', 'T').substring(0, 16);
            document.getElementById('editVenueId').value = event.venue_id || '';
            document.getElementById('editAvailableTickets').value = event.available_tickets || '';
            document.getElementById('editEventPrice').value = event.ticket_price || event.price || '';
            document.getElementById('editEventDescription').value = event.description || '';

            new bootstrap.Modal(document.getElementById('editEventModal')).show();
        }

        // Update Event Form Submission
        document.getElementById('editEventForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const eventId = document.getElementById('editEventId').value;

            const bodyData = {
                event_name: document.getElementById('editEventName').value,
                event_date: document.getElementById('editEventDate').value,
                venue_id: document.getElementById('editVenueId').value,
                available_tickets: document.getElementById('editAvailableTickets').value,
                ticket_price: document.getElementById('editEventPrice').value,
                description: document.getElementById('editEventDescription').value
            };

            try {
                const response = await fetch(`http://localhost/EventTicketing/api/index.php/events/${eventId}`, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const result = await response.json();
                if (response.ok) {
                    alert("Event updated successfully!");
                    location.reload();
                } else {
                    alert(result.message || "Failed to update event.");
                }
            } catch (error) {
                alert("Error connecting to server.");
            }
        });

        // Delete Event (Fully functional)
        async function deleteEvent(eventId) {
            if (!confirm(`Are you sure you want to delete event #${eventId}?`)) return;

            try {
                const response = await fetch(`http://localhost/EventTicketing/api/index.php/events/${eventId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                });

                let result = {};
                try {
                    result = await response.json();
                } catch (err) {
                    // Jika API tidak kembalikan JSON tapi status ok
                }

                if (response.ok) {
                    alert("Event deleted successfully!");
                    fetchAdminEvents(); // Muat semula senarai acara secara langsung
                } else {
                    alert(result.message || "Failed to delete event.");
                }
            } catch (error) {
                console.error("Delete error:", error);
                alert("Error connecting to server.");
            }
        }

        // Export Bookings to CSV
        function exportBookingsCSV() {
            if (!allBookingsCache || allBookingsCache.length === 0) {
                alert("No booking data available to export!");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Booking ID,User,Event Name,Tickets,Total Price (RM)\n";
            allBookingsCache.forEach(b => {
                const row = [
                    b.booking_id || b.id || 'N/A',
                    `"${b.user_name || b.username || 'Customer'}"`,
                    `"${b.event_name || b.title || 'Event'}"`,
                    b.quantity || b.tickets || 1,
                    parseFloat(b.total_price || b.price || 0).toFixed(2)
                ].join(",");
                csvContent += row + "\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "event_bookings_report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize Data Fetching
        fetchAdminEvents();
        fetchAdminBookings();
    </script>
</body>
</html>
