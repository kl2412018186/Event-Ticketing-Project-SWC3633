<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventTicketing - Book Ticket</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .navbar-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #ffffff;
            padding: 30px;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            color: white;
        }
        .btn-outline-custom {
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            background: transparent;
            border-radius: 8px;
        }
        .btn-outline-custom:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: #fff;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-control-custom {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
        }
        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-color: #00c6ff;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass mb-5 py-3">
        <div class="container">
            <a class="navbar-brand logo-text" href="dashboard.html">🎟️ EventTicketing</a>
            <div>
                <a href="dashboard.html" class="btn btn-outline-custom btn-sm me-2">Dashboard</a>
                <a href="history.html" class="btn btn-outline-custom btn-sm me-2">Booking History</a>
                <button class="btn btn-outline-custom btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mb-5" style="max-width: 600px;">
        <h2 class="mb-4 fw-bold">Book Event Ticket</h2>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <div class="glass-card">
            <div id="loadingBox" class="text-center py-4">
                <div class="spinner-border text-info" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-white-50 mt-2">Loading event info...</p>
            </div>

            <form id="bookingForm" class="d-none">
                <div class="mb-3">
                    <label class="form-label text-white-50">Event Name</label>
                    <h4 id="eventName" class="fw-bold text-info">-</h4>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white-50">Ticket Price</label>
                    <h5 id="eventPrice" class="text-success fw-bold">RM 0.00</h5>
                </div>

                <div class="mb-4">
                    <label for="quantity" class="form-label text-white-50">Select Quantity</label>
                    <input type="number" id="quantity" class="form-control form-control-custom" value="1" min="1" max="10" required onchange="calculateTotal()">
                </div>

                <div class="p-3 bg-dark bg-opacity-50 rounded border border-secondary mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-white-50">Total Amount:</span>
                        <span id="totalPriceDisplay" class="fs-4 fw-bold text-success">RM 0.00</span>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="dashboard.html" class="btn btn-outline-custom">Cancel</a>
                    <button type="submit" class="btn btn-gradient" id="submitBtn">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Receipt Modal -->
    <div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border border-secondary" style="background: #1a1635;">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title text-info fw-bold">🎟️ Booking Confirmed!</h5>
                </div>
                <div class="modal-body py-4">
                    <p class="text-white-50">Your ticket reservation has been successfully placed.</p>
                    <div class="bg-dark p-3 rounded border border-secondary mb-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-white-50">Booking ID:</span>
                            <span id="receiptId" class="fw-bold text-white">#00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-white-50">Quantity:</span>
                            <span id="receiptQty" class="fw-bold text-white">1</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-white-50">Total Paid:</span>
                            <span id="receiptPrice" class="fw-bold text-success">RM 0.00</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-gradient w-100" onclick="goToHistory()">View Booking History</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle (Wajib untuk Modal berfungsi) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript Integration -->
    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');

        let singleTicketPrice = 0;

        if (!eventId) {
            alert("No event selected!");
            window.location.href = 'dashboard.html';
        } else {
            loadEventInfo(eventId);
        }

        async function loadEventInfo(id) {
            const loadingBox = document.getElementById('loadingBox');
            const bookingForm = document.getElementById('bookingForm');

            try {
                const response = await fetch(`http://localhost/EventTicketing/api/index.php/events/${id}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    const event = result.data;
                    singleTicketPrice = parseFloat(event.ticket_price || 0);

                    document.getElementById('eventName').textContent = event.event_name || 'Untitled Event';
                    document.getElementById('eventPrice').textContent = `RM ${singleTicketPrice.toFixed(2)}`;
                    
                    calculateTotal();

                    loadingBox.classList.add('d-none');
                    bookingForm.classList.remove('d-none');
                } else {
                    loadingBox.innerHTML = `<p class="text-danger">Failed to load event details.</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                loadingBox.innerHTML = `<p class="text-danger">Error connecting to server.</p>`;
            }
        }

        function calculateTotal() {
            const qty = parseInt(document.getElementById('quantity').value) || 1;
            const total = singleTicketPrice * qty;
            document.getElementById('totalPriceDisplay').textContent = `RM ${total.toFixed(2)}`;
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const qty = parseInt(document.getElementById('quantity').value) || 1;
            const totalPrice = singleTicketPrice * qty;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                const response = await fetch('http://localhost/EventTicketing/api/index.php/bookings', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_id: eventId,
                        quantity: qty
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Masukkan data ke dalam Modal Resit
                    document.getElementById('receiptId').textContent = '#' + (result.booking_id || 'N/A');
                    document.getElementById('receiptQty').textContent = qty;
                    document.getElementById('receiptPrice').textContent = `RM ${totalPrice.toFixed(2)}`;

                    // Paparkan Modal Resit
                    const receiptModal = new bootstrap.Modal(document.getElementById('receiptModal'));
                    receiptModal.show();
                } else {
                    alert(result.message || "Failed to place booking.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Confirm Booking';
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Error connecting to server.");
                submitBtn.disabled = false;
                submitBtn.textContent = 'Confirm Booking';
            }
        });

        function goToHistory() {
            window.location.href = 'history.html';
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
