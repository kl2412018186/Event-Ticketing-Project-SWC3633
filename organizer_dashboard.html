<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventTicketing - Organizer Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .navbar-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #ffffff;
            padding: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .table-custom {
            color: #ffffff;
            background: transparent;
        }
        .table-custom th, .table-custom td {
            background: transparent !important;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
            vertical-align: middle;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #f2709c, #ff9472);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #ff9472, #f2709c);
            box-shadow: 0 4px 15px rgba(242, 112, 156, 0.4);
            color: white;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #f2709c, #ff9472);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-control-custom {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            padding: 10px;
        }
        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-color: #f2709c;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass mb-4 py-3">
        <div class="container">
            <a class="navbar-brand logo-text" href="organizer_dashboard.html">🎯 Organizer Portal</a>
            <div>
                <button class="btn btn-danger btn-sm" onclick="localStorage.clear(); window.location.href='login.html';">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mb-5">
        <h2 class="mb-4 fw-bold">Organizer Management Dashboard</h2>

        <!-- Stats Overview -->
        <div class="row mb-5">
            <div class="col-md-6 mb-3">
                <div class="stat-card">
                    <span class="text-white-50 small text-uppercase">Total Managed Events</span>
                    <h2 id="orgTotalEvents" class="fw-bold text-warning mt-1 mb-0">0</h2>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="stat-card">
                    <span class="text-white-50 small text-uppercase">System Status</span>
                    <h2 class="fw-bold text-success mt-1 mb-0">Active</h2>
                </div>
            </div>
        </div>

        <!-- Section: Events Table -->
        <div class="card glass-card mb-5">
            <h4 class="text-warning mb-3">Events Managed By You</h4>
            <div class="table-responsive">
                <table class="table table-custom align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Event Name</th>
                            <th>Date & Time</th>
                            <th>Price (RM)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="orgEventList">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-white-50">Loading organizer events...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token') || '';

        async function fetchOrgEvents() {
            const tableBody = document.getElementById('orgEventList');
            try {
                const response = await fetch('http://localhost/EventTicketing/api/index.php/events', {
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                let events = Array.isArray(data) ? data : (data.events || data.data || []);

                document.getElementById('orgTotalEvents').textContent = events.length;
                tableBody.innerHTML = '';

                if (events.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-white-50">No events found.</td></tr>`;
                    return;
                }

                events.forEach(e => {
                    tableBody.innerHTML += `
                        <tr>
                            <td class="fw-bold">#${e.event_id || e.id}</td>
                            <td>${e.event_name || e.title}</td>
                            <td>${e.event_date || e.date}</td>
                            <td class="text-success fw-bold">RM ${parseFloat(e.ticket_price || e.price || 0).toFixed(2)}</td>
                            <td><span class="badge bg-warning text-dark">Active</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">Failed to load events.</td></tr>`;
            }
        }

        fetchOrgEvents();
    </script>
</body>
</html>
